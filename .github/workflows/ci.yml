name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check + build
        run: npm run build

      - name: Lint (React hooks rules)
        run: npm run lint

      - name: Generator smoke tests
        run: npm test

  # Opens every screen of the tool shell in a real browser and fails naming any screen that reports a fault.
  shell-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install a browser for the smoke check
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Shell smoke check
        run: npm run smoke:shell
